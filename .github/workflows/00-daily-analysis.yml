name: 每日股票分析




on:
  # 定时触发 - 每周一至周五北京时间 09:27 (UTC 01:27)
  schedule:
    - cron: '27 1 * * 1-5'→ Runs at 10:00, Monday through Friday     # 周一到周五，UTC 01:27 = 北京时间 09:27
  
  # 手动触发
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full          # 完整分析（股票+大盘）
          - market-only   # 仅大盘复盘
          - stocks-only   # 仅股票分析
      force_run:
        description: '强制运行（跳过交易日检查）'
        required: false
        default: false
        type: boolean




# 并发控制：同一时间只运行一个分析任务
concurrency:
  group: stock-analysis
  cancel-in-progress: false




jobs:
  analyze:
    runs-on: ubuntu-latest
    # 兼容误将 STOCK_LIST 配到同名 Environment variables 的场景；
    # 推荐位置仍是 Settings -> Secrets and variables -> Actions -> Repository variables。
    environment: STOCK_LIST
